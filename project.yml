name: Hangar
options:
  bundleIdPrefix: io.github.rsutcliffe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.13"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.hangar
targets:
  Hangar:
    type: application
    platform: macOS
    sources: [Sources/Hangar]
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Hangar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hangar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Hangar connects to your other Macs over SSH to read their CI runner status.
  HangarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/HangarTests]
    dependencies:
      - target: Hangar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.hangar.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hangar.app/Contents/MacOS/Hangar
